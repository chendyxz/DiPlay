name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DashFlow-debug-${{ github.sha }}
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html

  kitkat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;23.2.8568313
      - uses: gradle/actions/setup-gradle@v4
      - name: API 19 runtime tests, protocol tests, lint and ARMv7 build
        run: ./gradlew -Pkitkat=true :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace
      - name: Upload KitKat debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DashFlow-kitkat-armv7-debug-${{ github.sha }}
          path: mobile/build/kitkat/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: KitKat test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitkat-test-reports
          path: |
            shared/build/kitkat/reports/tests/
            common/build/kitkat/reports/tests/
            mobile/build/kitkat/reports/lint-results-debug.html
